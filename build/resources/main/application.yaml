ktor:
  application:
    modules:
      - com.example.ApplicationKt.module

  deployment:
    port: 8080
    host: "0.0.0.0"
    watch:
      - classes
      - resources

database:
  url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
  user: ${DB_USER:postgres}
  password: ${DB_PASSWORD:postgres}
  driver: "org.postgresql.Driver"

logging:
  level: INFO