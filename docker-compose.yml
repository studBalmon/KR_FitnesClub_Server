version: "3.9"

services:
  db:
    image: postgres:15
    container_name: fitness-db
    restart: always
    environment:
      POSTGRES_DB: fitness
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fitness"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: fitness-server
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/fitness
      DB_USER: postgres
      DB_PASSWORD: 1234
      JWT_SECRET: "change-me-in-production"

volumes:
  pgdata:
